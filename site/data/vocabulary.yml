- id: vocab-gpudirect-storage
  name: "GPUDirect Storage; VAST, WEKA, DDN"
  term: "GPUDirect Storage; VAST, WEKA, DDN"
  definition: "Storage that feeds GPUs without passing through the CPU, and the three vendors most often named beside GPU clusters."
  source: https://docs.nvidia.com/gpudirect-storage/overview-guide/
  checked: 2026-10-06
  confidence: verified
  note: "Opened 2026-10-06: NVIDIA's GPUDirect Storage overview defines GDS as a direct path between GPU memory and storage that avoids a bounce buffer through the CPU, and names DDN EXAScaler, VAST NFS and WekaFS among supported file systems. That the three are the vendors most often named is this site's reading, not NVIDIA's."
  path: fabric
  related: [fabric]

- id: vocab-cdu-tcs-fws
  name: "CDU, TCS, FWS"
  term: "CDU, TCS, FWS"
  definition: "Coolant distribution unit, and the two loops it separates: technology cooling system in the rack, facility water system in the building."
  source: https://www.vertiv.com/en-us/insights/articles/educational-articles/understanding-coolant-distribution-units-cdus-for-liquid-cooling/
  checked: 2026-09-18
  confidence: verified
  note: "The Vertiv page defines CDU thoroughly and confirms it isolates the facility water loop from the technology cooling loop, but only names \"TCS\" and \"FWS\" in passing without spelling out or defining either acronym directly; the two-loop separation this row describes is well supported, the specific acronym expansions are more loosely supported by this source."
  path: cooling
  related: [cooling]

