# Vocabulary glossary. Migrated from research/2026-09-18_draft-site/data-neoclouds.js
# (window.VOCAB, lines ~106-119) per docs/plan.md Task B6. Draft row shape:
# [term, definition, source, path] -> {id, name, term, definition, source, path}.
#
# confidence: the draft carries no per-row ok flag for VOCAB (that column only exists on
# NEOCLOUDS). `verified` below means the source was actually opened this session and checked
# against the row's own claim, not merely that a URL existed in the draft. A first pass of this
# file marked every row with a real URL `verified` on that weaker basis; a review caught one
# wrong citation elsewhere in this package (see events.yml) and flagged that method as unsound
# here too, so every row was reopened. Where the opened page did not fully support the claim,
# the row was downgraded to `unverified` with a note saying what the source does and does not
# cover, rather than left as an unearned `verified`. See docs/scrub/B6.md.
#
# related: each row's own `path` value (fabric, ops, rack, facility, cooling) is carried into
# `related` too, so the vocabulary entry links back to its learning path via the Connects-to
# block. Those path ids belong to Task B5, running in parallel.

