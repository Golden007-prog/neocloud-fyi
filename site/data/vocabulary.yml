- id: vocab-nccl-tests
  name: NCCL tests and burn-in
  term: NCCL tests and burn-in
  definition: "All-reduce benchmarks used as the acceptance test for a new cluster; they expose bad links before production."
  source: https://www.together.ai/blog/a-practitioners-guide-to-testing-and-running-large-gpu-clusters-for-training-generative-ai-models
  checked: 2026-09-18
  confidence: verified
  note: "Source changed from the draft's github.com/NVIDIA/nccl-tests (whose own README only claims to check performance and correctness, not cluster acceptance) to Together AI's practitioner's guide, which explicitly describes running NCCL tests across a cluster to find bad nodes, leaf switches or spine switches before production."
  path: fabric
  related: [fabric]

- id: vocab-infiniband-vs-spectrum-x
  name: InfiniBand vs Spectrum-X
  term: InfiniBand vs Spectrum-X
  definition: "InfiniBand is deterministic and still leads in SuperPODs. Spectrum-X brings lossless behaviour, adaptive routing and telemetry to Ethernet and closes most of the gap."
  source: https://www.weka.io/learn/enterprise-technology/nvidia-spectrum-x/
  checked: 2026-09-18
  confidence: verified
  note: "Opened this session. The page confirms InfiniBand as more deterministic and dominant in SuperPODs/TOP500 systems, and Spectrum-X's congestion-aware, adaptive routing on Ethernet; it does not use the word \"lossless\" itself, though it describes the same congestion-control behaviour."
  path: fabric
  related: [fabric]

- id: vocab-ufm-netq-wjh
  name: "UFM, NetQ, WJH"
  term: "UFM, NetQ, WJH"
  definition: "UFM is NVIDIA's fabric manager. NetQ is its network monitoring and validation tool, and WJH (What Just Happened) is used to diagnose congestion and packet loss. All three are named in the NCP-AIN exam objectives."
  source: https://dam-cdn.nvd.orangelogic.com/AssetLink/32ljugfxg1hs1sd42371npw1xmcuo1yo.pdf
  checked: 2026-10-07
  confidence: verified
  note: "Opened 2026-10-07: NVIDIA's NCP-AIN study guide (PDF, read as text) lists NetQ, What Just Happened (WJH) and UFM among the exam's tools, for example 'Diagnose congestion or packet loss using in-band telemetry and NVIDIA What Just Happened (WJH) services' and 'Use NetQ for real-time network monitoring'. NVIDIA's NetQ 5.3 user guide has a 'Configure and Monitor What Just Happened' chapter. The UFM Enterprise manual (https://docs.nvidia.com/networking/display/UFMEnterpriseUMv6170/UFM+Overview) describes UFM as a fabric manager."
  path: fabric
  related: [fabric]

