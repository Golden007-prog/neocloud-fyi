# Exam catalogue. Migrated from research/2026-09-18_draft-site/data-learning.js (window.EXAMS,
# lines ~130-172) per docs/plan.md Task B2. The `f` array on each draft row is split into
# vendor/price/format/proctoring/validity in its existing order; rows whose draft array had
# fewer than five elements simply leave the trailing named fields unset.
#
# confidence: the draft carries no per-row ok flag for exams, so each row's confidence was set
# from how well the figures below `source` are actually corroborated, not just from whether the
# draft's own prose flagged a price. Four rows are confidence: unverified, each with a note
# naming exactly what is unconfirmed: Schneider DCCA and EPI CDCP flag their own price in the
# draft's prose ("price from community sources" / "about USD 2,500 (unconfirmed)") and keep that
# parenthetical wording in `price` rather than a cleaned-up bare number; CNet CDCDP's ~USD 5,000
# is a third-party estimate not published on CNet's own page; NCP-AII has no official blueprint
# PDF and its price/format/proctoring were never independently checked this session, only its
# existence. The remaining rows were read on the vendor's own certification page (url) and
# official blueprint PDF (guide), so confidence: verified — though exam-atd carries a note that
# its figures come from a search snippet after the official subpage 503'd.
#
# related: the exam's `path` id, so the path page lists its exams. These ids (fabric, ops, rack,
# facility, cooling) belong to Task B5, running in parallel, and may not exist yet — see B2.md.

