  checked: 2026-10-19
  confidence: verified
  related: [fabric]
  vendor: NVIDIA
  price: "USD 400"
  format: "70 to 75 questions, 2 h"
  proctoring: "online proctored"
  validity: "valid 2 years"
  path: fabric
  verdict: core
  guide: https://dam-cdn.nvd.orangelogic.com/AssetLink/32ljugfxg1hs1sd42371npw1xmcuo1yo.pdf
