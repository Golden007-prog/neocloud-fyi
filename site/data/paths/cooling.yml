id: cooling
name: "Cooling: liquid to the chip, heat to the air"
source: https://neocloud.fyi/sources/
checked: 2026-09-18
confidence: verified
note: site's own compiled learning path, synthesised from the sources cited in each step
hours: 10 h
cost: free
summary: Above roughly 20 to 30 kW per rack, air stops being practical. NVL72-class racks are cooled by liquid at the chip, with a small air remainder. NVIDIA specifies 45 deg C inlet water for GB200, GB300 and Vera Rubin. Thirteen topics are described further down.
not_found: Germany's Energy Efficiency Act is the European reference for heat-reuse obligations; no equivalent applies across the EU as a whole.
related:
  - rack
  - facility
  - fabric
  - ops
related_reasons:
  rack: Inlet temperature, flow and the liquid-to-air split come from the rack specification.
  facility: Cooler fans in the PUE and pipe trenches are facility decisions.
  fabric: Hoses and NVLink copper share the rear of the rack; switch racks stay air-cooled.
  ops: Loss of flow removes cooling capacity abruptly, so telemetry and alarms are operational, not only mechanical.
