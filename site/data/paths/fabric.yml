id: fabric
name: "Fabric: InfiniBand and Spectrum-X Ethernet"
source: https://neocloud.fyi/sources/
checked: 2026-09-18
confidence: verified
note: site's own compiled learning path, synthesised from the sources cited in each step
hours: about 24 h
cost: USD 630 to 660 with the exam
summary: "How GPUs talk to each other across racks. Two fabrics compete: InfiniBand, and NVIDIA Spectrum-X, which brings lossless Ethernet (RoCE), adaptive routing and telemetry to standard Ethernet. The exam weighs them equally at 30 % each; troubleshooting tools are another 20 %."
not_found: No first-person pass reports, no official practice exam and no credible video series were found. Sites selling 'actual questions' are dumps and break the exam agreement.
related:
  - ops
  - rack
  - facility
  - cooling
related_reasons:
  ops: The Slurm topology plugin and NCCL both model this fabric. The NVIDIA Network Operator (5 % of the exam) is the seam with Kubernetes.
  rack: Passive copper reaches 1.5 to 3 m, active copper about 7 m, optics 50 m to 2 km. Those limits decide which racks must stand together.
  facility: Cable limits set row pitch and tray sizes. Every 400G or 800G optic draws roughly 10 to 30 W, which lands in the rack power and cooling budget.
  cooling: Copper NVLink harnesses and coolant hoses compete for the same space at the back of the rack.
