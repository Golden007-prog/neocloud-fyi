source: https://neocloud.fyi/sources/
checked: 2026-09-18
confidence: verified
note: site's own compiled learning path, synthesised from the sources cited in each step
hours: 15 to 20 h
cost: free
summary: "The numbers a building has to meet: power per rack, coolant flow, inlet temperature, weight, and how far cables can run. All of it is in free NVIDIA and OCP documents. NVIDIA had not published a data-centre design guide for Vera Rubin by September 2026."
not_found: No public NVIDIA design guide for Vera Rubin yet. A Schneider and NVIDIA blueprint was announced in March 2026 without a public PDF.
related:
  - fabric
  - ops
  - facility
  - cooling
related_reasons:
  fabric: The rail-optimised topology in the fabric path is the logical description of how these racks are wired to leaf switches.
  ops: Mission Control and BCM bring the rack up and watch its health.
  facility: Rack kW, litres per minute and kilograms are the load the building must serve.
  cooling: Most of an NVL72 rack's heat leaves in liquid and the remainder in air, so the rack sets both loops.
