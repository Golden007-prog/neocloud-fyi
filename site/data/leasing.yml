- id: lease-hyperscaler-threshold
  name: Hyperscaler deals start around 100 MW
  requirement: Hyperscaler deals start around 100 MW
  detail: Trade reporting on the 2026 mega-colo deals puts the hyperscaler anchor size at roughly 100 MW and up.
  source: https://www.datacenters.com/news/inside-the-mega-colo-surge-why-hyperscalers-are-signing-100mw-deals
  checked: 2026-09-18
  confidence: unverified
  note: "Opened in a browser 2026-10-07. The datacenters.com article states that hyperscalers such as Amazon, Google and Microsoft are locking in colocation leases exceeding 100MW, against 5MW once being a major win. That supports the roughly 100 MW figure. It is a marketplace blog, not a primary source, and the page shows no 2026 deal, so the row's wording '2026 mega-colo deals' is not supported by it and the row stays unverified."
