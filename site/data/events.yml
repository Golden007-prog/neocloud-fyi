# [date, headline, source] -> {id, name, date, headline, what, source}.
#
# `what`: the schema requires both `headline` and `what`; the draft has only one text field per
# event. `headline` below is a short title; `what` carries the draft's own descriptive sentence
# (sometimes lightly reworded to stand on its own once separated from the headline), so no fact
# is dropped and nothing is duplicated verbatim between the two fields.
#
# date: ISO where the draft gives a full day ("30 Oct 2025" -> 2025-10-30); the draft's own
# month-and-year string where it gives no day ("Mar 2026", "Jun 2026", "Sep 2026").
#
# confidence: the draft carries no per-row ok flag for EVENTS. `verified` below means the source
# was actually opened this session and checked to say what the row says — not just that a URL
# was present. A first pass marked every row with a draft-supplied URL `verified` on the weaker
# basis that the URL merely existed; a review caught that this had let one wrong citation
# through (below) and required every row to be reopened and either confirmed or downgraded. See
# docs/scrub/B6.md.
#
# related: the provider id(s) each event is about, cross-checked against site/data/providers.yml
# as migrated by Task B1 (running in parallel).

